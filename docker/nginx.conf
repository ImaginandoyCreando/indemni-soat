user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ─── CLAVE: desactiva bufferización de respuestas PHP-FPM ────────────────
    # Sin esto, nginx acumula el HTML en RAM y puede cortar la respuesta
    # antes de que PHP-FPM termine de generarla (NS_ERROR_NET_PARTIAL_TRANSFER).
    fastcgi_buffering       off;
    fastcgi_read_timeout    120s;
    fastcgi_send_timeout    120s;
    fastcgi_connect_timeout 10s;

    # Buffers de respuesta HTTP al cliente — lo suficiente para no acumular
    proxy_buffering         off;
    gzip                    off;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        client_max_body_size 50M;

        # Archivos estaticos — servidos directamente, sin pasar por PHP
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp|pdf|map)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Laravel — todas las rutas pasan por index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            fastcgi_pass    127.0.0.1:9000;
            fastcgi_index   index.php;

            # Params estandar FastCGI
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;

            # ─── Desactiva buffering por bloque PHP ─────────────────────────
            fastcgi_buffering       off;
            fastcgi_read_timeout    120s;

            # Sin compresion: gzip + PHP pueden generar Content-Length erroneo
            gzip off;
        }

        # Niega acceso directo a .env y archivos ocultos
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
